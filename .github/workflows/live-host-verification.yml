name: DataFixer live host verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'playwright.config.ts'
      - 'scripts/verify-live-host.mjs'
      - 'tests/e2e/**'
      - 'vercel.json'
      - '.github/workflows/live-host-verification.yml'
  workflow_run:
    workflows: ['DataFixer production gates']
    types: [completed]

permissions:
  contents: read
  statuses: read

jobs:
  live-host:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: npm

      - name: Install deterministic dependencies
        run: npm ci --ignore-scripts

      - name: Install Chrome for live smoke tests
        run: ./node_modules/.bin/playwright install --with-deps chrome

      - name: Wait for Vercel status on merged main
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          for attempt in $(seq 1 30); do
            state="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/status" --jq '[.statuses[] | select(.context == "Vercel")][0].state // "missing"')"
            echo "Vercel status attempt ${attempt}: ${state}"
            if [ "${state}" = "success" ]; then
              exit 0
            fi
            if [ "${state}" = "failure" ] || [ "${state}" = "error" ]; then
              echo "Vercel deployment failed for ${SHA}" >&2
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for Vercel deployment status for ${SHA}" >&2
          exit 1

      - name: Verify live response headers and discover production origin
        id: live
        run: |
          base_url="$(node scripts/verify-live-host.mjs)"
          echo "base_url=${base_url}" >> "${GITHUB_OUTPUT}"
          echo "Verified live origin: ${base_url}"

      - name: Run live CSV, XLSX and privacy smoke tests
        env:
          DATAFIXER_BASE_URL: ${{ steps.live.outputs.base_url }}
        run: >-
          ./node_modules/.bin/playwright test
          tests/e2e/clean.spec.ts
          tests/e2e/live-xlsx.spec.ts
          tests/e2e/privacy.spec.ts
          --project=chrome
